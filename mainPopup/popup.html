<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Менеджер писем</title><style>
body{font-family:Arial,sans-serif;width:320px;margin:0;padding:16px;color:#0b2e59;background:#eaf2fb}.card{background:linear-gradient(180deg,#ffffff 0%,#f4f9ff 100%);border:1px solid #b9d1ee;border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(0,94,184,.12)}h1{font-size:20px;margin:0 0 6px}p{margin:0 0 12px;color:#3f5f86;font-size:13px}.btn{display:block;width:100%;padding:10px 12px;margin-top:10px;border:1px solid #8cb4e8;border-radius:10px;background:#fff;cursor:pointer;font-weight:700;transition:.2s ease}.btn[hidden]{display:none}.primary{background:#005eb8;color:#fff;border-color:#005eb8}.stop{border-color:#bd4c4c;color:#982f2f;background:#fff8f8}.btn:hover{box-shadow:0 6px 18px rgba(0,94,184,.18);transform:translateY(-1px)}.btn:focus-visible{outline:3px solid #76afe9;outline-offset:2px}.muted{font-size:12px;color:#5d7da6;margin-top:10px}
</style></head><body><div class="card"><h1>Менеджер писем</h1><p>Правила, ручное сохранение вложений и статистика.</p><button id="rules" class="btn primary">Правила</button><button id="settings" class="btn">Настройки</button><button id="statistics" class="btn">Статистика</button><button id="audit" class="btn" hidden>Журнал проверки</button><button id="forceExport" class="btn">Проверить письма по правилам</button><button id="stopForceExport" class="btn stop" hidden>Остановить проверку</button><div id="status" class="muted" aria-live="polite">Готов к работе</div><div id="pluginVersionMini" class="muted">Версия: —</div></div><script src="popup.js"></script></body></html>
