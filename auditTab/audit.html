<!doctype html><html><head><meta charset='utf-8'><title>Журнал проверки писем</title><style>body{font-family:Arial,sans-serif;margin:0;padding:24px;color:#0b2e59;background:#eaf2fb}.card{background:linear-gradient(180deg,#ffffff 0%,#f4f9ff 100%);border:1px solid #b9d1ee;border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(0,94,184,.12)}h1{margin:0 0 8px;font-size:34px}p{margin:0 0 16px;color:#5d7da6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,button{padding:10px 12px;border:1px solid #8cb4e8;border-radius:10px}button{background:#fff;cursor:pointer;font-weight:700}.primary{background:#005eb8;color:#fff;border-color:#005eb8}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d6e0f5;padding:10px;vertical-align:top;text-align:left}th{background:#eef3ff}.muted{font-size:12px;color:#5d7da6}</style></head><body><div class='card'><h1>Журнал проверки писем</h1><p>Показывает проверенные письма, совпадения правил, причины пропуска и ошибки обработки.</p><div class='actions'><input id='senderFilter' placeholder='Имя или email'><button id='refreshBtn' class='primary'>Обновить</button><button id='retryFailedBtn'>Повторить ошибки</button><button id='retrySelectedBtn'>Повторить выбранные</button></div><div id='retryStatus' class='muted' style='margin-bottom:12px'></div><table id='auditTable'><thead><tr><th><input type='checkbox' id='selectAll' title='Выбрать все проблемные'></th><th>Дата проверки</th><th>Время проверки</th><th>Ящик</th><th>Отправитель</th><th>Тема</th><th>Статус</th><th>Правило</th><th>Причина</th><th>Обработано вложений</th><th>Повторная обработка</th></tr></thead><tbody></tbody></table></div><script type='module' src='audit.js'></script></body></html>
