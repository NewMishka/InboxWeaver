name: Ошибка
description: Сообщить о воспроизводимой проблеме InboxWeaver
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте реальные письма, адреса, вложения, пароли, токены или необезличенные диагностические данные.
  - type: input
    id: version
    attributes:
      label: Версия InboxWeaver
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Почтовый клиент и версия
      placeholder: "Thunderbird 154.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Кратко опишите фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальная последовательность действий.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Дополнительная диагностика
      description: Только обезличенные данные.
  - type: checkboxes
    id: privacy
    attributes:
      label: Конфиденциальность
      options:
        - label: Я проверил, что в сообщении нет персональных данных, содержимого писем, токенов и локальных путей.
          required: true
